[tool.ruff]
target-version = "py312"
line-length = 100
include = ["scripts/**/*.py", "tests/**/*.py", "auv_env/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["scripts", "auv_env"]
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
